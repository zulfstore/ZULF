    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;

          // 1. Explicitly patch Window.prototype which holds the native getter
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {}
          }

          // 2. Walk entire prototype chain of window to ensure any level can be set
          var p = window;
          while (p) {
            try {
              Object.defineProperty(p, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
            try {
              p = Object.getPrototypeOf(p);
            } catch (e3) {
              break;
            }
          }

          // 3. Patch globalThis if present
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e4) {}
          }
        } catch (eTop) {}
      })();
